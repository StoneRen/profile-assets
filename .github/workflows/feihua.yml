name: Update Feihua

on:
  schedule:
    # 每月1号凌晨3点 (UTC时间前一天19:00)
    - cron: '0 19 1 * *'
  workflow_dispatch:

jobs:
  fetch-feihua:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Fetch Feihua SVG
        run: |
          curl -o feihua.svg https://feihua.onrender.com/shici/stoneren

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add feihua.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update feihua.svg" && git push)
