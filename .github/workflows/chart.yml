name: Update Contribution Chart

on:
  schedule:
    # 每周一凌晨1点 (UTC时间周日17:00)
    - cron: '0 17 * * 0'
  workflow_dispatch:

jobs:
  generate-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate contribution chart
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: StoneRen
        run: python generate-chart.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add contributions.svg contributions-dark.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update contribution chart" && git push)
